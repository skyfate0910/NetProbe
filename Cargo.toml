[package]
name = "netprobe"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.29", features = ["default"] }
eframe = { version = "0.29", features = ["default"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0"
uuid = { version = "1.0", features = ["v4"] }
crossbeam = "0.8"
socket2 = "0.5"
chrono = "0.4"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
